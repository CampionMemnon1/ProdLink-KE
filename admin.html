<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProdLink KE Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#172033;
}

header{
  background:#172033;
  color:white;
  padding:20px;
}

header h1{margin:0 0 5px}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:18px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 2px 8px #ddd;
}

input,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 15px;
  border-radius:9px;
  background:#1683ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}

.delete{
  background:#e53935;
}

.logout{
  background:#667085;
}

.hidden{
  display:none;
}

.message{
  font-weight:bold;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.badge{
  background:#eef4ff;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:25px 0;
}
</style>
</head>

<body>

<header>
  <h1>👑 ProdLink KE Admin</h1>
  <p>Marketplace control center</p>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginCard" class="card">

<h2>🔐 Admin Login</h2>

<input
  id="email"
  type="email"
  placeholder="Admin email"
>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button onclick="login()">
  Login
</button>

<p id="loginMessage" class="message"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

<div class="card">

<div class="row">

<div>
<h2>Dashboard</h2>
<p id="welcome"></p>
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</div>


<!-- BUSINESSES -->

<div class="card">

<h2>🏪 Businesses</h2>

<div id="businesses">
Loading...
</div>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>📦 Products</h2>

<div id="products">
Loading...
</div>

</div>


<!-- TEAM -->

<div id="teamSection" class="card hidden">

<h2>👥 Team</h2>

<p>
Only the Owner can manage collaborators.
</p>

<div id="team">
Loading...
</div>

<hr>

<h3>➕ Add Collaborator</h3>

<p>
For now, collaborators must first have a
Supabase Auth account.
</p>

<input
  id="newUserId"
  placeholder="Collaborator User ID"
>

<select id="newRole">

<option value="admin">
Admin
</option>

<option value="moderator">
Moderator
</option>

<option value="viewer">
Viewer
</option>

</select>

<button onclick="addCollaborator()">
Add Collaborator
</button>

<p id="teamMessage" class="message"></p>

</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://caspleasocqyefolvgno.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MvVKXlV6n8Y1sRs8VvZtYw_zqI0LgCr";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  const {error} =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    document.getElementById(
      "loginMessage"
    ).textContent =
      "❌ " + error.message;

    return;
  }


  await checkAdmin();
}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient

      .from("admin_users")

      .select("role")

      .eq(
        "user_id",
        user.id
      )

      .maybeSingle();


  if(error){

    console.error(error);

    return;
  }


  if(
    !data ||
    ![
      "owner",
      "admin"
    ].includes(data.role)
  ){

    alert(
      "❌ You do not have admin access."
    );

    await supabaseClient.auth.signOut();

    return;
  }


  document
    .getElementById("loginCard")
    .classList.add("hidden");


  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  document
    .getElementById("welcome")
    .textContent =
      "Logged in as " +
      data.role.toUpperCase();


  if(data.role === "owner"){

    document
      .getElementById("teamSection")
      .classList.remove("hidden");

    loadTeam();
  }


  loadBusinesses();

  loadProducts();
}


/* =========================
   BUSINESSES
========================= */

async function loadBusinesses(){

  const {
    data,
    error
  } =
    await supabaseClient

      .from("businesses")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


  const container =
    document.getElementById(
      "businesses"
    );


  if(error){

    container.innerHTML =
      "❌ " +
      escapeHTML(error.message);

    return;
  }


  container.innerHTML = "";


  if(!data.length){

    container.innerHTML =
      "<p>No businesses found.</p>";

    return;
  }


  data.forEach(
  business => {

    const card =
      document.createElement("div");

    card.className = "card";

    const status =
      business.status || "pending";

    let actions = "";

    if (status === "pending") {

      actions = `

        <button
          onclick="approveBusiness('${business.id}')"
        >
          ✅ Approve
        </button>

        <button
          class="delete"
          onclick="rejectBusiness('${business.id}')"
        >
          ❌ Reject
        </button>

      `;

    }

    else if (status === "approved") {

      actions = `

        <span class="badge">
          🟢 Approved
        </span>

        <button
          class="delete"
          onclick="deleteBusiness('${business.id}')"
        >
          🗑️ Delete
        </button>

      `;

    }

    else {

      actions = `

        <span class="badge">
          🔴 Rejected
        </span>

        <button
          onclick="approveBusiness('${business.id}')"
        >
          ✅ Approve
        </button>

        <button
          class="delete"
          onclick="deleteBusiness('${business.id}')"
        >
          🗑️ Delete
        </button>

      `;

    }


    card.innerHTML = `

      <div class="row">

        <div>

          <h3>
            ${escapeHTML(business.name)}
          </h3>

          <p>
            📍 ${escapeHTML(
              business.location || ""
            )}
          </p>

          <p>
            Status:
            <strong>
              ${escapeHTML(status)}
            </strong>
          </p>

        </div>

        <div>
          ${actions}
        </div>

      </div>

    `;

    container.appendChild(card);

  }
);

/* APPROVE BUSINESS */

async function approveBusiness(id) {

  const {
    error
  } =
    await supabaseClient

      .from("businesses")

      .update({
        status: "approved"
      })

      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "❌ " +
      error.message
    );

    return;
  }


  loadBusinesses();
}


/* REJECT BUSINESS */

async function rejectBusiness(id) {

  if (
    !confirm(
      "Reject this business?"
    )
  ) {

    return;
  }


  const {
    error
  } =
    await supabaseClient

      .from("businesses")

      .update({
        status: "rejected"
      })

      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "❌ " +
      error.message
    );

    return;
  }


  loadBusinesses();
}
/* =========================
   DELETE BUSINESS
========================= */

async function deleteBusiness(id){

  if(
    !confirm(
      "Delete this business and its products?"
    )
  ){

    return;
  }


  const {
    error
  } =
    await supabaseClient

      .from("businesses")

      .delete()

      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "❌ " +
      error.message
    );

    return;
  }


  loadBusinesses();

  loadProducts();
}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

  const {
    data,
    error
  } =
    await supabaseClient

      .from("products")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


  const container =
    document.getElementById(
      "products"
    );


  if(error){

    container.innerHTML =
      "❌ " +
      escapeHTML(error.message);

    return;
  }


  container.innerHTML = "";


  if(!data.length){

    container.innerHTML =
      "<p>No products found.</p>";

    return;
  }


  data.forEach(
    product => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card";


      card.innerHTML = `

        <div class="row">

          <div>

            <h3>
              ${escapeHTML(
                product.name
              )}
            </h3>

            <p>
              KSh ${
                Number(
                  product.price
                ).toLocaleString()
              }
            </p>

          </div>

          <button
            class="delete"
            onclick="deleteProduct(
              '${product.id}'
            )"
          >
            🗑️ Delete
          </button>

        </div>

      `;


      container.appendChild(card);

    }
  );
}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

    return;
  }


  const {
    error
  } =
    await supabaseClient

      .from("products")

      .delete()

      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "❌ " +
      error.message
    );

    return;
  }


  loadProducts();
}


/* =========================
   TEAM
========================= */

async function loadTeam(){

  const {
    data,
    error
  } =
    await supabaseClient

      .from("admin_users")

      .select("*");


  const container =
    document.getElementById(
      "team"
    );


  if(error){

    container.innerHTML =
      "❌ " +
      escapeHTML(error.message);

    return;
  }


  container.innerHTML = "";


  data.forEach(
    member => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card";


      card.innerHTML = `

        <div class="row">

          <div>

            <p>
              User ID:
              ${escapeHTML(
                member.user_id
              )}
            </p>

            <span class="badge">
              ${escapeHTML(
                member.role
              )}
            </span>

          </div>

          ${
            member.role !== "owner"

            ? `

              <button
                class="delete"
                onclick="removeMember(
                  '${member.user_id}'
                )"
              >
                Remove
              </button>

            `

            : ""

          }

        </div>

      `;


      container.appendChild(card);

    }
  );
}


/* =========================
   ADD COLLABORATOR
========================= */

async function addCollaborator(){

  const userId =
    document
      .getElementById("newUserId")
      .value
      .trim();


  const role =
    document
      .getElementById("newRole")
      .value;


  const message =
    document.getElementById(
      "teamMessage"
    );


  if(!userId){

    message.textContent =
      "❌ Enter a User ID.";

    return;
  }


  const {
    error
  } =
    await supabaseClient

      .from("admin_users")

      .insert({

        user_id:userId,

        role:role

      });


  if(error){

    message.textContent =
      "❌ " +
      error.message;

    return;
  }


  message.textContent =
    "✅ Collaborator added.";


  document
    .getElementById("newUserId")
    .value = "";


  loadTeam();
}


/* =========================
   REMOVE COLLABORATOR
========================= */

async function removeMember(userId){

  if(
    !confirm(
      "Remove this collaborator?"
    )
  ){

    return;
  }


  const {
    error
  } =
    await supabaseClient

      .from("admin_users")

      .delete()

      .eq(
        "user_id",
        userId
      );


  if(error){

    alert(
      "❌ " +
      error.message
    );

    return;
  }


  loadTeam();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>
</html>
