<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProdLink KE Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
  color: #172033;
}

header {
  background: #172033;
  color: white;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 20px;
  border-radius: 14px;
  box-shadow: 0 2px 8px #ddd;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 8px;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  background: #1683ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.hidden {
  display: none;
}

#error {
  color: #d32f2f;
}

#success {
  color: #16883b;
}
</style>
</head>

<body>

<header>
  <h1>👑 ProdLink KE Admin</h1>
  <p>Admin control center</p>
</header>

<div class="container">

  <!-- LOGIN -->

  <div id="loginCard" class="card">

    <h2>🔐 Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Your admin email"
    >

    <input
      id="password"
      type="password"
      placeholder="Your password"
    >

    <button
      id="loginButton"
      type="button"
    >
      Login
    </button>

    <p id="error"></p>
    <p id="success"></p>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="card hidden">

    <h2>🎉 Welcome to ProdLink KE</h2>

    <p id="roleText"></p>

    <button
      id="logoutButton"
      type="button"
    >
      Logout
    </button>

    <hr>

    <h3>🏪 Businesses</h3>

    <div id="businesses">
      Loading...
    </div>

  </div>

</div>


<script>

/* =====================================
   SUPABASE CONFIGURATION
===================================== */

const SUPABASE_URL =
"https://caspleasocqyefolvgno.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MvVKXlV6n8Y1sRs8VvZtYw_zqI0LgCr";


/* =====================================
   CREATE SUPABASE CLIENT
===================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   LOGIN
===================================== */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const error =
    document.getElementById("error");

  const success =
    document.getElementById("success");

  const button =
    document.getElementById("loginButton");


  error.textContent = "";
  success.textContent = "";


  if (!email || !password) {

    error.textContent =
      "Please enter your email and password.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Logging in...";


  try {

    const result =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (result.error) {

      error.textContent =
        "❌ " +
        result.error.message;

      button.disabled = false;

      button.textContent =
        "Login";

      return;
    }


    success.textContent =
      "Login successful. Checking permissions...";


    await checkAdmin();


  } catch (err) {

    error.textContent =
      "❌ " +
      err.message;

    button.disabled = false;

    button.textContent =
      "Login";

  }

}


/* =====================================
   CHECK ADMIN
===================================== */

async function checkAdmin() {

  const result =
    await supabaseClient.auth.getUser();


  if (result.error || !result.data.user) {

    document.getElementById(
      "error"
    ).textContent =
      "❌ Could not find your account.";

    return;
  }


  const user =
    result.data.user;


  const adminResult =
    await supabaseClient

      .from("admin_users")

      .select("role")

      .eq(
        "user_id",
        user.id
      )

      .maybeSingle();


  if (adminResult.error) {

    document.getElementById(
      "error"
    ).textContent =
      "❌ " +
      adminResult.error.message;

    return;
  }


  if (
    !adminResult.data ||
    ![
      "owner",
      "admin"
    ].includes(
      adminResult.data.role
    )
  ) {

    document.getElementById(
      "error"
    ).textContent =
      "❌ Your account does not have admin access.";

    await supabaseClient.auth.signOut();

    return;
  }


  document
    .getElementById("loginCard")
    .classList.add("hidden");


  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  document
    .getElementById("roleText")
    .textContent =
      "Logged in as: " +
      adminResult.data.role.toUpperCase();


  loadBusinesses();

}


/* =====================================
   LOAD BUSINESSES
===================================== */

async function loadBusinesses() {

  const container =
    document.getElementById(
      "businesses"
    );


  const result =
    await supabaseClient

      .from("businesses")

      .select("*")

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (result.error) {

    container.textContent =
      "❌ " +
      result.error.message;

    return;
  }


  if (!result.data.length) {

    container.textContent =
      "No businesses found.";

    return;
  }


  container.innerHTML = "";


  result.data.forEach(
    business => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "card";


      item.innerHTML = `

        <strong>
          ${escapeHTML(
            business.name
          )}
        </strong>

        <p>
          Status:
          ${escapeHTML(
            business.status || "pending"
          )}
        </p>

      `;


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================
   LOGOUT
===================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================
   BUTTON EVENTS
===================================== */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    logout
);


/* =====================================
   CHECK EXISTING SESSION
===================================== */

checkAdmin();

</script>

</body>
</html>
