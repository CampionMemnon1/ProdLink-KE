<header>

  placeholder="🔎 Search businesses..."
>

</p>

<script>


/* ==================================
   SUPABASE
================================== */

/*
   IMPORTANT:
   Put the SAME values from your
   current working index.html here.

   Do NOT use your service-role key.
*/

const SUPABASE_URL =
"https://caspleasocqyefolvgno.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MvVKXlV6n8Y1sRs8VvZtYw_zqI0LgCr";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==================================
   BUSINESSES
================================== */

let allBusinesses = [];


async function loadBusinesses() {

  const container =
    document.getElementById(
      "businesses"
    );


  const result =
    await supabaseClient

      .from("businesses")

      .select("*")

      .eq(
        "status",
        "approved"
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (result.error) {
   
    console.error("Supabase error:", result.error);
    
    container.innerHTML = `

      <p class="error">

        Unable to load businesses.

      </p>
      
      <p>${result.error.message}</p>
    `;

    return;
  }


  allBusinesses =
    result.data || [];


  displayBusinesses(
    allBusinesses
  );

}


/* ==================================
   DISPLAY BUSINESSES
================================== */

function displayBusinesses(
  businesses
) {

  const container =
    document.getElementById(
      "businesses"
    );


  if (!businesses.length) {

    container.innerHTML = `

      <div class="empty">

        <h2>
          No businesses found
        </h2>

        <p>
          Try another search.
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML = "";


  businesses.forEach(
    business => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "business";


      card.innerHTML = `

        <h2>

          ${escapeHTML(
            business.name
          )}

        </h2>


        <p class="location">

          📍

          ${escapeHTML(
            business.location || ""
          )}

        </p>


        ${
          business.description

          ? `

            <p>

              ${escapeHTML(
                business.description
              )}

            </p>

          `

          : ""
        }


        <button
          onclick="
            openBusiness(
              '${business.id}'
            )
          "
        >

          👀 View Business

        </button>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* ==================================
   SEARCH
================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    function() {

      const query =
        this.value
          .toLowerCase()
          .trim();


      if (!query) {

        displayBusinesses(
          allBusinesses
        );

        return;
      }


      const filtered =
        allBusinesses.filter(
          business => {

            const name =
              (
                business.name || ""
              )
              .toLowerCase();


            const location =
              (
                business.location || ""
              )
              .toLowerCase();


            const description =
              (
                business.description || ""
              )
              .toLowerCase();


            return (

              name.includes(
                query
              )

              ||

              location.includes(
                query
              )

              ||

              description.includes(
                query
              )

            );

          }
        );


      displayBusinesses(
        filtered
      );

    }
  );


/* ==================================
   OPEN BUSINESS
================================== */

function openBusiness(
  id
) {

  window.location.href =
    "business.html?id=" +
    encodeURIComponent(id);

}


/* ==================================
   SECURITY
================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================================
   START
================================== */

loadBusinesses();

</script>
