<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="QWSpnQhyVCxxzR3WJglYidkMotTc_j2PnOKvHTaaae0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProdLink KE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}
header{background:#172033;color:#fff;padding:25px 20px}
.logo{font-size:30px;font-weight:bold}.logo span{color:#1683ff}
header p{color:#d0d5dd}
.container{max-width:750px;margin:auto;padding:20px}
.search{display:flex;gap:8px;margin:20px 0}.search input{flex:1;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{border:none;background:#1683ff;color:#fff;padding:12px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
.categories{display:flex;gap:10px;overflow-x:auto}.category{white-space:nowrap}
.products{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
.product{background:#fff;padding:12px;border-radius:15px;box-shadow:0 3px 10px #ddd;cursor:pointer}
.product-image{height:150px;background:#eef3f8;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover}
.price{color:#1683ff;font-weight:bold;font-size:18px}.seller{color:#667085;font-size:14px}
.business{margin-top:30px;padding:20px;background:#172033;color:#fff;border-radius:15px}
.business form{display:flex;flex-direction:column;gap:10px}
.business input,.business textarea,.business select{padding:13px;border:none;border-radius:8px;font-size:15px}
.business textarea{min-height:80px;resize:vertical}#message{font-weight:bold;margin-top:12px}
.details,.business-profile{display:none;background:#fff;padding:20px;margin-top:25px;border-radius:15px;box-shadow:0 3px 10px #ddd}
.details img{width:100%;max-height:350px;object-fit:cover;border-radius:12px}
.details h1{margin-bottom:5px}.big-price{color:#1683ff;font-size:25px;font-weight:bold}
footer{text-align:center;padding:30px;color:#667085}
@media(max-width:450px){.products{grid-template-columns:1fr 1fr}.search button{padding:10px}}
</style>
</head>
<body>
<header>
<div class="logo">ProdLink <span>KE</span></div>
<p>Find phones, chargers & accessories near you.</p>
</header>

<div class="container">
<div class="search">
<input id="searchInput" type="text" placeholder="Search phones, chargers..." oninput="searchProducts()">
<button onclick="searchProducts()">Search</button>
</div>

<h2>Categories</h2>
<div class="categories">
<button class="category" onclick="filterCategory('phone')">📱 Phones</button>
<button class="category" onclick="filterCategory('charger')">🔌 Chargers</button>
<button class="category" onclick="filterCategory('accessory')">🎧 Accessories</button>
<button class="category" onclick="loadProducts()">All</button>
</div>

<h2>Products</h2>
<div id="products" class="products"><p>Loading products...</p></div>

<div id="productDetails" class="details">
<button onclick="closeProduct()">← Back</button>
<div id="productDetailsContent"></div>
</div>

<div id="businessProfile" class="business-profile">
<button onclick="closeBusiness()">← Back</button>
<div id="businessProfileContent"></div>
</div>

<div class="business">
<h2>📢 List Your Business</h2>
<p>Get your products discovered on ProdLink KE.</p>
<form onsubmit="submitListing(event)">
<input id="businessName" type="text" placeholder="Business name" required>
<input id="location" type="text" placeholder="Location" required>
<input id="phone" type="tel" placeholder="WhatsApp number e.g. 254712345678" required>
<textarea id="description" placeholder="Tell customers about your business"></textarea>
<input id="productName" type="text" placeholder="Product name" required>
<input id="price" type="number" placeholder="Price in KSh" required>
<select id="category">
<option value="phone">📱 Phone</option>
<option value="charger">🔌 Charger</option>
<option value="accessory">🎧 Accessory</option>
</select>
<input id="productImage" type="url" placeholder="Product image URL (optional)">
<button type="submit">Submit Listing</button>
</form>
<p id="message"></p>
</div>
</div>

<footer>© 2026 ProdLink KE</footer>

<script>
const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";
const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function loadProducts(){
const container=document.getElementById("products");
container.innerHTML="<p>Loading products...</p>";
const {data,error}=await supabaseClient.from("products").select(`
id,name,price,category,image_url,business_id,
businesses(id,name,location,phone,description)
`).order("created_at",{ascending:false});
if(error){console.error(error);container.innerHTML="<p>Could not load products.</p>";return}
displayProducts(data);
}

function displayProducts(products){
const container=document.getElementById("products");
container.innerHTML="";
if(!products||products.length===0){container.innerHTML="<p>No products listed yet.</p>";return}
products.forEach(function(product){
const business=product.businesses;
const image=product.image_url?`<img src="${escapeHTML(product.image_url)}" alt="${escapeHTML(product.name)}">`:"📱";
const card=document.createElement("div");
card.className="product";
card.innerHTML=`
<div class="product-image">${image}</div>
<h3>${escapeHTML(product.name)}</h3>
<p class="price">KSh ${Number(product.price).toLocaleString()}</p>
<p class="seller">🏪 ${business?escapeHTML(business.name):"Seller"}</p>
<p class="seller">📍 ${business?escapeHTML(business.location):""}</p>`;
card.onclick=function(){openProduct(product)};
container.appendChild(card);
});
}

async function searchProducts(){
const search=document.getElementById("searchInput").value.trim().toLowerCase();
if(!search){loadProducts();return}
const {data,error}=await supabaseClient.from("products").select(`
id,name,price,category,image_url,business_id,
businesses(id,name,location,phone,description)
`).ilike("name",`%${search}%`);
if(error){console.error(error);return}
displayProducts(data);
}

async function filterCategory(category){
const {data,error}=await supabaseClient.from("products").select(`
id,name,price,category,image_url,business_id,
businesses(id,name,location,phone,description)
`).eq("category",category);
if(error){console.error(error);return}
displayProducts(data);
}

async function submitListing(event){
event.preventDefault();
const message=document.getElementById("message");
message.textContent="Submitting...";
const business={
name:document.getElementById("businessName").value.trim(),
location:document.getElementById("location").value.trim(),
phone:document.getElementById("phone").value.trim(),
description:document.getElementById("description").value.trim()
};
const {data:businessData,error:businessError}=await supabaseClient.from("businesses").insert(business).select().single();
if(businessError){console.error(businessError);message.textContent="❌ Could not submit business.";return}
const product={
business_id:businessData.id,
name:document.getElementById("productName").value.trim(),
price:Number(document.getElementById("price").value),
category:document.getElementById("category").value,
image_url:document.getElementById("productImage").value.trim()||null
};
const {error:productError}=await supabaseClient.from("products").insert(product);
if(productError){console.error(productError);message.textContent="⚠️ Business saved, but product failed.";return}
message.textContent="✅ Listing successfully added!";
event.target.reset();
await loadProducts();
}

function openProduct(product){
const details=document.getElementById("productDetails");
const content=document.getElementById("productDetailsContent");
const business=product.businesses;
const image=product.image_url?`<img src="${escapeHTML(product.image_url)}" alt="${escapeHTML(product.name)}">`:`<div class="product-image">📱</div>`;
content.innerHTML=`
${image}
<h1>${escapeHTML(product.name)}</h1>
<p class="big-price">KSh ${Number(product.price).toLocaleString()}</p>
<p>🏪 ${business?escapeHTML(business.name):"Seller"}</p>
<p>📍 ${business?escapeHTML(business.location):""}</p>
<button onclick="openSellerWhatsApp('${escapeHTML(business?business.phone:"")}','${escapeHTML(product.name)}')">💬 Contact Seller</button>
${business?`<button onclick="openBusiness(${business.id})">🏪 View Business</button>`:""}`;
details.style.display="block";
details.scrollIntoView({behavior:"smooth"});
}

function openSellerWhatsApp(phone,product){
const cleanPhone=phone.replace(/\D/g,"");
const message=encodeURIComponent("Hi, I found your "+product+" on ProdLink KE.");
window.open("https://wa.me/"+cleanPhone+"?text="+message,"_blank");
}

async function openBusiness(businessId){
const {data:business,error}=await supabaseClient.from("businesses").select("*").eq("id",businessId).single();
if(error){console.error(error);return}
const {data:products}=await supabaseClient.from("products").select("*").eq("business_id",businessId);
const profile=document.getElementById("businessProfile");
const content=document.getElementById("businessProfileContent");
content.innerHTML=`
<h1>${escapeHTML(business.name)}</h1>
<p>📍 ${escapeHTML(business.location)}</p>
<p>${escapeHTML(business.description||"")}</p>
<h2>Products</h2>
<div class="products">
${products&&products.length?products.map(function(product){return `
<div class="product" onclick="showProductFromBusiness(${product.id})">
<div class="product-image">${product.image_url?`<img src="${escapeHTML(product.image_url)}" alt="${escapeHTML(product.name)}">`:"📱"}</div>
<h3>${escapeHTML(product.name)}</h3>
<p class="price">KSh ${Number(product.price).toLocaleString()}</p>
</div>`}).join(""):"<p>No products yet.</p>"}
</div>`;
profile.style.display="block";
profile.scrollIntoView({behavior:"smooth"});
}

async function showProductFromBusiness(productId){
const {data:product,error}=await supabaseClient.from("products").select(`
id,name,price,category,image_url,business_id,
businesses(id,name,location,phone,description)
`).eq("id",productId).single();
if(error){console.error(error);return}
openProduct(product);
}

function closeProduct(){document.getElementById("productDetails").style.display="none"}
function closeBusiness(){document.getElementById("businessProfile").style.display="none"}

function escapeHTML(value){
return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

loadProducts();
</script>
</body>
</html>
